name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Throwaway credentials for the CI database service only.
env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: raff
  POSTGRES_USER: raff
  POSTGRES_PASSWORD: ci-only
  DJANGO_SECRET_KEY: ci-only-not-a-secret

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: make lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: make typecheck

  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: raff
          POSTGRES_USER: raff
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raff -d raff"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: make test

  openapi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: make openapi-check

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Browsers and their system libraries are preinstalled (no apt at run time).
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      POSTGRES_HOST: postgres
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: raff
          POSTGRES_USER: raff
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raff -d raff"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/

  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Browsers and their system libraries are preinstalled (no apt at run time).
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      POSTGRES_HOST: postgres
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: raff
          POSTGRES_USER: raff
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raff -d raff"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm visual
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/

  # `make dev` brings the whole stack up from scratch and both endpoints answer.
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make dev
      - run: curl --fail --silent http://localhost:8000/api/v1/health/
      - run: curl --fail --silent --output /dev/null http://localhost:3000/
      - run: curl --fail --silent http://localhost:3000/api/v1/health/
      - if: failure()
        run: docker compose -f infra/compose/compose.yaml --env-file infra/compose/.env logs
      - if: always()
        run: make down
