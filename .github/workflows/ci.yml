name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Throwaway credentials for the CI database service only.
env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: raff
  POSTGRES_USER: raff
  POSTGRES_PASSWORD: ci-only
  DJANGO_SECRET_KEY: ci-only-not-a-secret

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: make lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: make typecheck

  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: raff
          POSTGRES_USER: raff
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raff -d raff"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: make test
      - run: make perf

  openapi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: make openapi-check

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Browsers and their system libraries are preinstalled (no apt at run time).
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      POSTGRES_HOST: postgres
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: raff
          POSTGRES_USER: raff
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raff -d raff"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/

  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Browsers and their system libraries are preinstalled (no apt at run time).
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      POSTGRES_HOST: postgres
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: raff
          POSTGRES_USER: raff
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raff -d raff"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm visual
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/

  # `make dev` brings the whole stack up from scratch and both endpoints answer.
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make dev
      - run: curl --fail --silent http://localhost:8000/api/v1/health/
      - run: curl --fail --silent --output /dev/null http://localhost:3000/
      - run: curl --fail --silent http://localhost:3000/api/v1/health/
      - if: failure()
        run: docker compose -f infra/compose/compose.yaml --env-file infra/compose/.env logs
      - if: always()
        run: make down

  # WO-10 acceptance: install the production stack, back up, wipe the server, restore with
  # one command on the "clean" machine, and prove a failed update rolls back by itself.
  deploy-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -p raff -f infra/prod/compose.yaml --env-file infra/prod/.env
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install (plain HTTP)
        run: >-
          sudo RAFF_OWNER_PASSWORD=drill-owner-pass infra/install.sh --http
          --org "Drill Pharmacy" --branch-code KRT --branch-ar "فرع الخرطوم" --branch-en Khartoum
          --owner owner --owner-ar "المالك" --owner-en Owner --no-cron
      - name: Sample data
        run: sudo $COMPOSE exec -T -e RAFF_DEMO_PASSWORD=drill-demo-pass backend python manage.py seed_demo
      - name: Served through Caddy
        run: |
          curl -fsS http://localhost/api/v1/health/
          curl -fsS -o /dev/null http://localhost/login
          # The store's location button and the stocktake camera need these (review D-06).
          curl -fsSI http://localhost/login | grep -qi "permissions-policy: camera=(self), microphone=(), geolocation=(self)"
          curl -fsS http://localhost/api/v1/public/products/ | grep -q par-500
      - name: Backup
        run: |
          echo "BACKUP=$(sudo infra/backup/backup.sh | tail -n 1)" >> "$GITHUB_ENV"
          echo "ITEMS=$(sudo $COMPOSE exec -T postgres psql -U raff -d raff -tAc 'SELECT count(*) FROM catalog_item')" >> "$GITHUB_ENV"
      - name: Wipe the server (a clean replacement)
        run: |
          sudo cp infra/prod/backup.key /tmp/backup.key
          sudo $COMPOSE down --volumes
          sudo rm -f infra/prod/.env infra/prod/backup.key
      - name: Restore with one command
        run: sudo infra/restore.sh "$BACKUP" --key /tmp/backup.key --http
      - name: The data came back
        run: |
          test "$(sudo $COMPOSE exec -T postgres psql -U raff -d raff -tAc 'SELECT count(*) FROM catalog_item')" = "$ITEMS"
          curl -fsS http://localhost/api/v1/public/products/ | grep -q par-500
      - name: A damaged backup leaves the current data untouched
        run: |
          mkdir -p /tmp/bad && cd /tmp/bad
          sudo openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:/tmp/backup.key -in "$BACKUP" | tar -xf - meta.json
          echo "not a database dump" > db.dump
          tar -cf media.tar --files-from /dev/null
          tar -cf bundle.tar db.dump media.tar meta.json
          sudo openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:/tmp/backup.key -in bundle.tar -out bad.tar.enc
          cd "$GITHUB_WORKSPACE"
          set +e
          sudo infra/restore.sh /tmp/bad/bad.tar.enc --key /tmp/backup.key --no-build
          code=$?
          set -e
          test "$code" -ne 0
          test "$(sudo $COMPOSE exec -T postgres psql -U raff -d raff -tAc 'SELECT count(*) FROM catalog_item')" = "$ITEMS"
          curl -fsS http://localhost/api/v1/health/
      - name: Weekly restore drill
        run: sudo infra/restore.sh --verify-latest
      - name: A failed update rolls back
        run: |
          set +e
          sudo RAFF_UPDATE_SIMULATE_FAILURE=1 infra/update.sh
          code=$?
          set -e
          test "$code" -ne 0
          curl -fsS http://localhost/api/v1/health/
          test "$(sudo $COMPOSE exec -T postgres psql -U raff -d raff -tAc 'SELECT count(*) FROM catalog_item')" = "$ITEMS"
      - name: Logs
        if: failure()
        run: sudo $COMPOSE logs --tail 200

  # Known vulnerabilities in runtime dependencies (Python and the frontend's production deps).
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Python
        run: |
          uv export --directory backend --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit==2.9.0 --strict --requirement /tmp/requirements.txt
      - name: Node
        run: pnpm audit --prod --audit-level high

