openapi: 3.0.3
info:
  title: Raff API
  version: 1.0.0
paths:
  /api/v1/auth/context/:
    post:
      operationId: auth_context
      description: Choose the branch and counter this session works in.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Context'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      description: Sets the csrftoken cookie; call before the first state-changing
        request.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/device/:
    get:
      operationId: auth_device
      description: Which counter this browser is registered as (from the HttpOnly
        device cookie).
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/branches/:
    get:
      operationId: branches_list
      tags:
      - branches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/branches/{id}/:
    get:
      operationId: branches_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - branches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/catalog/barcode/:
    get:
      operationId: catalog_barcode_lookup
      parameters:
      - in: query
        name: code
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarcodeLookup'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_list
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: catalog_categories_create
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/export/:
    get:
      operationId: catalog_items_export
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/v1/catalog/imports/:
    post:
      operationId: catalog_imports_preview
      tags:
      - catalog
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/v1/catalog/imports/{id}/:
    get:
      operationId: catalog_imports_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/v1/catalog/imports/{id}/apply/:
    post:
      operationId: catalog_imports_apply
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/v1/catalog/items/:
    get:
      operationId: catalog_items_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemList'
          description: ''
    post:
      operationId: catalog_items_create
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
  /api/v1/catalog/items/{id}/:
    get:
      operationId: catalog_items_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
    patch:
      operationId: catalog_items_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
  /api/v1/catalog/items/{id}/prices/:
    post:
      operationId: catalog_items_price
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceInput'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
  /api/v1/catalog/price-lists/:
    get:
      operationId: catalog_price_lists
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceList'
          description: ''
  /api/v1/devices/:
    get:
      operationId: devices_list
      tags:
      - devices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
    post:
      operationId: devices_create
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/{id}/register/:
    post:
      operationId: devices_register
      description: Register the calling browser as this counter (sets the HttpOnly
        device cookie).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/health/:
    get:
      operationId: health
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/inventory/batches/{id}/release/:
    post:
      operationId: inventory_batch_release
      description: Give a held batch its expiry date and make it sellable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Release'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchRow'
          description: ''
  /api/v1/inventory/items/:
    get:
      operationId: inventory_items
      description: Items with their stock in the session's branch (Items & stock screen).
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockItem'
          description: ''
  /api/v1/inventory/items/{id}/:
    get:
      operationId: inventory_item
      description: One item with its stock in the session's branch (item drawer).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
          description: ''
  /api/v1/inventory/items/{id}/batches/:
    get:
      operationId: inventory_item_batches
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchRow'
          description: ''
  /api/v1/inventory/items/{id}/movements/:
    get:
      operationId: inventory_item_movements
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movement'
          description: ''
  /api/v1/licensing/status/:
    get:
      operationId: licensing_status
      tags:
      - licensing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseStatus'
          description: ''
  /api/v1/purchasing/receipts/:
    get:
      operationId: receipts_list
      parameters:
      - in: query
        name: status
        schema:
          type: string
      tags:
      - purchasing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceiptList'
          description: ''
    post:
      operationId: receipts_create
      tags:
      - purchasing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptInput'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
  /api/v1/purchasing/receipts/{id}/:
    get:
      operationId: receipts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - purchasing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
    put:
      operationId: receipts_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - purchasing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptInput'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
          description: ''
  /api/v1/purchasing/receipts/{id}/post/:
    post:
      operationId: receipts_post
      description: Post (approve) a draft receipt. Requires an Idempotency-Key header.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - purchasing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResult'
          description: ''
  /api/v1/roles/:
    get:
      operationId: roles_list
      tags:
      - roles
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
          description: ''
  /api/v1/suppliers/:
    get:
      operationId: suppliers_list
      tags:
      - suppliers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
          description: ''
    post:
      operationId: suppliers_create
      tags:
      - suppliers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Supplier'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
          description: ''
  /api/v1/users/:
    get:
      operationId: users_list
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
    post:
      operationId: users_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/{id}/:
    patch:
      operationId: users_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    Assignment:
      type: object
      properties:
        role_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
          nullable: true
      required:
      - role_id
    BarcodeLookup:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/ItemList'
        unit:
          $ref: '#/components/schemas/Unit'
      required:
      - item
      - unit
    BatchRow:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        batch_no:
          type: string
        expiry_date:
          type: string
          format: date
          nullable: true
        quantity_base:
          type: integer
        location:
          type: string
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        status:
          $ref: '#/components/schemas/BatchStatusEnum'
      required:
      - batch_id
      - batch_no
      - expiry_date
      - location
      - quantity_base
      - status
      - unit_cost
    BatchStatusEnum:
      enum:
      - good
      - near_expiry
      - expired
      - held
      - quarantined
      type: string
      description: |-
        * `good` - good
        * `near_expiry` - near_expiry
        * `expired` - expired
        * `held` - held
        * `quarantined` - quarantined
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 20
        name_ar:
          type: string
          maxLength: 120
        name_en:
          type: string
          maxLength: 120
        city_ar:
          type: string
          maxLength: 80
        city_en:
          type: string
          maxLength: 80
        receipt_locale:
          $ref: '#/components/schemas/ReceiptLocaleEnum'
      required:
      - code
      - id
      - name_ar
      - name_en
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 40
        name_ar:
          type: string
          maxLength: 120
        name_en:
          type: string
          maxLength: 120
      required:
      - code
      - id
      - name_ar
      - name_en
    ClassificationEnum:
      enum:
      - otc
      - rx
      type: string
      description: |-
        * `otc` - Over the counter
        * `rx` - Prescription
    Context:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
          nullable: true
      required:
      - branch_id
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        branch:
          type: string
          format: uuid
        name_ar:
          type: string
          maxLength: 80
        name_en:
          type: string
          maxLength: 80
        registered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - branch
      - id
      - is_active
      - name_ar
      - name_en
      - registered_at
    DeviceCreate:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        name_ar:
          type: string
          maxLength: 80
        name_en:
          type: string
          maxLength: 80
      required:
      - branch_id
      - name_ar
      - name_en
    DeviceInfo:
      type: object
      properties:
        registered:
          type: boolean
        device:
          allOf:
          - $ref: '#/components/schemas/Device'
          nullable: true
        branch:
          allOf:
          - $ref: '#/components/schemas/Branch'
          nullable: true
      required:
      - branch
      - device
      - registered
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    ImportBatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        file_name:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/ImportStatusEnum'
        summary: {}
        rows: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        applied_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - file_name
      - id
    ImportStatusEnum:
      enum:
      - preview
      - applied
      type: string
      description: |-
        * `preview` - Preview
        * `applied` - Applied
    ImportUpload:
      type: object
      properties:
        file:
          type: string
          format: uri
      required:
      - file
    ItemCreate:
      type: object
      properties:
        code:
          type: string
          maxLength: 40
        name_ar:
          type: string
          maxLength: 200
        name_en:
          type: string
          maxLength: 200
        generic_name:
          type: string
          default: ''
          maxLength: 200
        strength:
          type: string
          default: ''
          maxLength: 60
        dosage_form:
          type: string
          default: ''
          maxLength: 40
        category_id:
          type: string
          format: uuid
          nullable: true
        classification:
          allOf:
          - $ref: '#/components/schemas/ClassificationEnum'
          default: otc
        reorder_level_base:
          type: integer
          minimum: 0
          default: 0
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnitInput'
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
      required:
      - code
      - name_ar
      - name_en
      - units
    ItemDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 40
        name_ar:
          type: string
          maxLength: 200
        name_en:
          type: string
          maxLength: 200
        generic_name:
          type: string
