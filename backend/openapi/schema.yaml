openapi: 3.0.3
info:
  title: Raff API
  version: 1.0.0
paths:
  /api/v1/audit/events/:
    get:
      operationId: audit_events
      description: Who did what, newest first (append-only).
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: object_type
        schema:
          type: string
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
          description: ''
  /api/v1/auth/context/:
    post:
      operationId: auth_context
      description: Choose the branch and counter this session works in.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Context'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf
      description: Sets the csrftoken cookie; call before the first state-changing
        request.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/device/:
    get:
      operationId: auth_device
      description: Which counter this browser is registered as (from the HttpOnly
        device cookie).
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/branches/:
    get:
      operationId: branches_list
      tags:
      - branches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/branches/{id}/:
    get:
      operationId: branches_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - branches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/catalog/barcode/:
    get:
      operationId: catalog_barcode_lookup
      parameters:
      - in: query
        name: code
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarcodeLookup'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_list
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: catalog_categories_create
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/export/:
    get:
      operationId: catalog_items_export
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/v1/catalog/imports/:
    post:
      operationId: catalog_imports_preview
      tags:
      - catalog
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/v1/catalog/imports/{id}/:
    get:
      operationId: catalog_imports_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/v1/catalog/imports/{id}/apply/:
    post:
      operationId: catalog_imports_apply
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/v1/catalog/items/:
    get:
      operationId: catalog_items_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemList'
          description: ''
    post:
      operationId: catalog_items_create
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
  /api/v1/catalog/items/{id}/:
    get:
      operationId: catalog_items_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
    patch:
      operationId: catalog_items_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
  /api/v1/catalog/items/{id}/prices/:
    post:
      operationId: catalog_items_price
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceInput'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
  /api/v1/catalog/price-lists/:
    get:
      operationId: catalog_price_lists
      tags:
      - catalog
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceList'
          description: ''
  /api/v1/customers/:
    get:
      operationId: customers_list
      parameters:
      - in: query
        name: q
        schema:
          type: string
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
          description: ''
    post:
      operationId: customers_create
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/dashboard/:
    get:
      operationId: dashboard
      description: Dashboard figures for the session's branch, or every branch the
        user may see.
      parameters:
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - all
          - branch
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
          description: ''
  /api/v1/devices/:
    get:
      operationId: devices_list
      tags:
      - devices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
    post:
      operationId: devices_create
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/{id}/register/:
    post:
      operationId: devices_register
      description: Register the calling browser as this counter (sets the HttpOnly
        device cookie).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/finance/bank-transfers/:
    get:
      operationId: finance_bank_transfers
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - all
          - pending
      tags:
      - finance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankTransfer'
          description: ''
  /api/v1/finance/bank-transfers/{id}/verify/:
    post:
      operationId: finance_bank_transfer_verify
      description: '''Confirm arrival'': the transfer reached the bank account.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - finance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
          description: ''
  /api/v1/finance/ledger/:
    get:
      operationId: finance_ledger
      parameters:
      - in: query
        name: party
        schema:
          type: string
        required: true
      - in: query
        name: type
        schema:
          type: string
          enum:
          - customer
          - supplier
        required: true
      tags:
      - finance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerRow'
          description: ''
  /api/v1/finance/parties/:
    get:
      operationId: finance_parties
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - customer
          - supplier
      tags:
      - finance
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Party'
          description: ''
  /api/v1/finance/payments/:
    post:
      operationId: finance_payment
      description: Record a collection from a customer or a payment to a supplier.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - finance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyPaymentIn'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyPaymentResult'
          description: ''
  /api/v1/health/:
    get:
      operationId: health
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/inventory/batches/{id}/release/:
    post:
      operationId: inventory_batch_release
      description: Give a held batch its expiry date and make it sellable.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Release'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchRow'
          description: ''
  /api/v1/inventory/items/:
    get:
      operationId: inventory_items
      description: Items with their stock in the session's branch (Items & stock screen).
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockItem'
          description: ''
  /api/v1/inventory/items/{id}/:
    get:
      operationId: inventory_item
      description: One item with its stock in the session's branch (item drawer).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'
          description: ''
  /api/v1/inventory/items/{id}/batches/:
    get:
      operationId: inventory_item_batches
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchRow'
          description: ''
  /api/v1/inventory/items/{id}/movements/:
    get:
      operationId: inventory_item_movements
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movement'
          description: ''
  /api/v1/licensing/status/:
    get:
      operationId: licensing_status
      tags:
      - licensing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseStatus'
          description: ''
  /api/v1/orders/:
    get:
      operationId: orders_list
      parameters:
      - in: query
        name: period
        schema:
          type: string
          enum:
          - all
          - today
          - week
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffOrderRow'
          description: ''
  /api/v1/orders/{id}/:
    get:
      operationId: orders_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffOrder'
          description: ''
  /api/v1/orders/{id}/lines/:
    patch:
      operationId: orders_edit_lines
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEditLines'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffOrder'
          description: ''
  /api/v1/orders/{id}/note/:
    patch:
      operationId: orders_note
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNote'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffOrder'
          description: ''
  /api/v1/orders/{id}/pos/:
    get:
      operationId: orders_pos
      description: A ready order as a POS cart (its lines, held batches). Only in
        'ready'.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosOrder'
          description: ''
  /api/v1/orders/{id}/transition/:
    post:
      operationId: orders_transition
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transition'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffOrder'
          description: ''
  /api/v1/orders/summary/:
    get:
      operationId: orders_summary
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersSummary'
          description: ''
  /api/v1/pos/barcode/:
    get:
      operationId: pos_barcode
      description: Exact barcode → the item row and the scanned unit (added to the
        cart at once).
      parameters:
      - in: query
        name: code
        schema:
          type: string
        required: true
      tags:
      - pos
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosItem'
          description: ''
  /api/v1/pos/items/:
    get:
      operationId: pos_items
      parameters:
      - in: query
        name: ids
        schema:
          type: string
        description: Comma-separated item ids
      - in: query
        name: q
        schema:
          type: string
      tags:
      - pos
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PosItem'
          description: ''
  /api/v1/pos/missing/:
    post:
      operationId: pos_missing
      description: Log an item a customer asked for that the pharmacy does not stock.
      tags:
      - pos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissingItem'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          description: No response body
  /api/v1/public/categories/:
    get:
      operationId: public_categories
      description: No session, no CSRF cookie needed for reads; rate limited per client.
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicCategory'
          description: ''
  /api/v1/public/orders/:
    post:
      operationId: public_order_place
      description: A guest sends the cart as a review request. Same key twice → the
        same order.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrder'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Placed'
          description: ''
  /api/v1/public/orders/{token}/:
    get:
      operationId: public_order
      description: Opened with the long random token from the WhatsApp link — never
        by order number.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
