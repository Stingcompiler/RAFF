[project]
name = "raff-backend"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django==6.1.2",
    "djangorestframework==3.18.3",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.6",
    "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "mypy==2.3.1",
    "django-stubs[compatible-mypy]==6.1.2",
    "djangorestframework-stubs[compatible-mypy]==3.18.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]
addopts = "--strict-markers -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F405"]
"**/tests/**" = ["DJ008", "RUF012", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["apps/.*/migrations/"]

[[tool.mypy.overrides]]
module = ["drf_spectacular.*"]
follow_untyped_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
