<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}button{font-family:inherit}a{color:#245C4F}a:hover{color:#172D29}
@keyframes fIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</helmet>
<div dir="{{ dir }}" style="{{ rootStyle }}">
<div dir="ltr" style="background:#2a2f2c;color:#ddd;display:flex;gap:8px;align-items:center;padding:8px 12px;font:500 12px 'IBM Plex Sans',sans-serif;flex-wrap:wrap">
<span style="opacity:.7">Raff flows · sample data</span>
<sc-for list="{{ switches }}" as="s" hint-placeholder-count="4"><button onClick="{{ s.go }}" style="{{ s.st }}">{{ s.label }}</button></sc-for>
<a href="Raff Screens.dc.html" style="color:#DCEB9D;margin-inline-start:auto">Screens →</a></div>
<div style="max-width:1180px;margin:0 auto;padding:32px 24px 64px;display:grid;gap:24px">
<h1 style="margin:0;font-size:28px;font-weight:500">{{ t.h }}</h1>
<div style="display:flex;gap:8px;flex-wrap:wrap"><sc-for list="{{ flowTabs }}" as="f" hint-placeholder-count="5"><button onClick="{{ f.go }}" style="{{ f.st }}">{{ f.l }}</button></sc-for></div>

<div style="display:flex;align-items:center;gap:0;position:relative;padding-block:8px">
<sc-for list="{{ nodes }}" as="n" hint-placeholder-count="5"><div onClick="{{ n.go }}" style="{{ n.box }}"><span style="{{ n.dot }}">{{ n.num }}</span><span style="font-size:13px;font-weight:500;text-align:center;line-height:1.3">{{ n.l }}</span><span style="{{ n.bar }}"></span></div></sc-for></div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:24px;align-items:start">
<div key="{{ stepKey }}" style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px;animation:fIn .4s cubic-bezier(.2,.8,.2,1) both">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="font-size:12px;font-weight:600;color:var(--muted)">{{ stepNo }}</span><span style="{{ badgeSt }}">{{ badge }}</span></div>
<h2 style="margin:0;font-size:22px;font-weight:500">{{ step.title }}</h2>
<p style="margin:0;color:var(--muted);line-height:1.7">{{ step.desc }}</p>
<div style="display:flex;gap:8px;margin-block-start:8px"><button onClick="{{ prev }}" style="{{ ghost }}">{{ t.prev }}</button><button onClick="{{ next }}" style="{{ prim }}">{{ t.next }}</button><button onClick="{{ play }}" style="{{ ghost }}">{{ playText }}</button></div>
</div>
<div key="{{ stepKey2 }}" style="background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;animation:fIn .4s .06s cubic-bezier(.2,.8,.2,1) both">
<sc-if value="{{ step.banner }}" hint-placeholder-val="{{ false }}"><div style="{{ bannerSt }}">{{ step.banner }}</div></sc-if>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="4"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:8px 20px;border-block-end:1px solid var(--line)"><span style="color:var(--muted)">{{ r.k }}</span><span style="{{ r.st }}">{{ r.v }}</span></div></sc-for>
</div></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script>

        [p('إضافة سطر', 'Line added'), p('سطر جديد بكمية 1، والقراءة المتكررة تزيد الكمية.', 'New line with qty 1; repeated scans raise the quantity.'), 'ok', p('السلة', 'Cart'), '', [[p('الكمية', 'Qty'), '1 → 2', ''], [p('الإجمالي', 'Total'), c('1,600 ج.س', 'SDG 1,600'), 'b']]],
        [p('الدفع F8', 'Pay F8'), p('يفتح حوار الدفع بالإجمالي كبيراً؛ النقدي افتراضي.', 'Opens payment with the total large; cash is the default.'), 'ok', p('حوار', 'Dialog'), '', [[p('الطريقة', 'Method'), p('نقدي', 'Cash'), ''], [p('المدفوع', 'Tendered'), c('2,000 ج.س', 'SDG 2,000'), ''], [p('الباقي', 'Change'), c('400 ج.س', 'SDG 400'), 'b']]],
        [p('جارٍ الاعتماد…', 'Approving…'), p('الزر معطّل ولا نجاح يُعرض قبل رد الخادم.', 'Button disabled; no success is shown before the server replies.'), 'wn', p('بانتظار الخادم', 'Awaiting server'), p('▲ لم يُسجَّل شيء بعد', '▲ Nothing recorded yet'), [[p('الحالة', 'State'), p('جارٍ الاعتماد…', 'Approving…'), '']]],
        [p('إيصال وبيع جديد', 'Receipt & new sale'), p('معاينة الإيصال مع طباعة وإعادة طباعة، وEnter لبيع جديد.', 'Receipt preview with print/reprint; Enter starts a new sale.'), 'ok', p('معتمد', 'Approved'), '', [[p('الفاتورة', 'Invoice'), '#1043', ''], [p('الإجراء', 'Next'), 'Enter', '']]]] },
      { n: p('دفعات متعددة', 'Multiple batches'), steps: [

        [p('رد المبلغ', 'Refund'), p('طريقة الرد، وحوار تأكيد بالأثر المالي.', 'Refund method, then a confirm dialog with the financial impact.'), 'ok', p('تأكيد', 'Confirm'), '', [[p('المبلغ', 'Amount'), c('2,400 ج.س', 'SDG 2,400'), 'b']]],

        [p('السلة', 'Cart'), p('إجمالي تقديري وتنبيه أن الأسعار تُراجع عند التأكيد.', 'Estimated total and a note that prices are reviewed on confirmation.'), 'wn', p('تقديري', 'Estimated'), p('▲ تُراجع الأسعار والتوفر عند التأكيد', '▲ Prices and availability are reviewed'), [[p('الإجمالي التقديري', 'Estimated total'), c('1,900 ج.س', 'SDG 1,900'), 'b']]],

</script>
</body>
</html>
